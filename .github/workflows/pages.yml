name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Verify static gallery manifest
        run: python scripts/verify_demo.py --check

      - name: Prepare Pages artifact
        run: |
          touch examples/generated_reports/.nojekyll
          test -f examples/generated_reports/index.html

      - name: Check Pages enablement
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status="$(curl -L -sS -o "$RUNNER_TEMP/pages.json" -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pages")"
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled. Enable Settings > Pages > Source: GitHub Actions, then rerun this workflow."
          else
            cat "$RUNNER_TEMP/pages.json"
            echo "Unexpected GitHub Pages API status: $status" >&2
            exit 1
          fi

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: examples/generated_reports
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Skip deployment when Pages is disabled
        if: steps.pages.outputs.enabled != 'true'
        run: |
          echo "Static gallery verified, but deployment was skipped because GitHub Pages is not enabled for this repository."
