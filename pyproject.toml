[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dgpforge"
version = "0.1.0"
description = "Verified simulation-study agent for causal DGPs and Monte Carlo benchmarks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "pydantic>=2",
  "pyyaml",
  "matplotlib",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "black==24.4.2",
  "mypy",
]
demo = ["streamlit"]

[project.scripts]
dgpforge = "dgpforge.cli:main"

[tool.setuptools.packages.find]
include = ["dgpforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"benchmark/run_benchmark.py" = ["E402"]
"scripts/build_demo.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disable_error_code = ["import-untyped"]
