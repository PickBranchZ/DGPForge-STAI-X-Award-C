schema_version: '1.0'
name: randomized_constant_effect_n1000
template: cross_sectional_binary_treatment_continuous_outcome
sample_sizes:
- 1000
n_replications: 80
seed: 20320602
covariates:
  X1:
    type: continuous
    distribution: normal
    mean: 0.0
    sd: 1.0
    p: null
    role: confounder
  X2:
    type: binary
    distribution: bernoulli
    mean: null
    sd: null
    p: 0.4
    role: confounder
  X3:
    type: continuous
    distribution: normal
    mean: 0.0
    sd: 1.0
    p: null
    role: prognostic
treatment:
  name: A
  type: binary
  assignment: randomized
  formula:
    intercept: 0.0
outcome:
  name: Y
  type: continuous
  model: linear
  exposure: null
  treatment_effect: 2.0
  treatment_effect_heterogeneity:
    enabled: false
    modifier: X2
    coefficient: 0.0
  coefficients:
    intercept: 0.0
    X1: 1.0
    X2: 0.5
    X3: 0.5
  noise_sd: 1.0
  overdispersion:
    enabled: false
    model: negative_binomial
    theta: 5.0
estimand:
  name: marginal_ATE
  contrast: E[Y(1) - Y(0)]
  primary: mean_difference
unobserved_confounder:
  enabled: false
  name: U
  distribution: normal
  mean: 0.0
  sd: 1.0
  treatment_coefficient: 0.0
  outcome_coefficient: 0.0
  observed: false
missing_data:
  enabled: false
  target: Y
  mechanism: MCAR
  rate: 0.0
  formula: {}
  apply_to:
  - Y
  missing_indicator_prefix: R
clusters:
  enabled: false
  cluster_id: cluster_id
  n_clusters: 1
  cluster_size: 1
  cluster_size_distribution: fixed
  icc: null
  random_intercept:
    outcome_sd: null
    treatment_sd: 0.0
  cluster_level_confounder:
    enabled: false
    name: Z_cluster
    distribution: normal
    mean: 0.0
    sd: 1.0
    treatment_coefficient: 0.0
    outcome_coefficient: 0.0
estimators:
- naive_difference
- adjusted_ols
- ipw
- aipw
