name: DGPForge
type: verified_simulation_study_agent
modes:
  - deterministic_statistical_engine
  - optional_llm_assisted_contract_agent
inputs:
  - yaml_dgp_contract
  - natural_language_prompt
  - paper_style_text_excerpt
  - existing_yaml_for_review
outputs:
  - validated_dgp_contract
  - assumptions_log
  - unresolved_questions
  - validation_report
  - deterministic_report_html
  - estimator_summary_csv
  - diagnostics_csv
  - review_report
capabilities:
  - schema_validation
  - known_truth_simulation
  - monte_carlo_estimator_benchmarking
  - diagnostics_and_coverage_reporting
  - prompt_to_contract_drafting
  - paper_excerpt_to_contract_drafting
  - config_review_with_deterministic_checks
safeguards:
  - no_llm_required_for_core_engine
  - provider_outputs_must_validate_as_structured_responses
  - drafted_contracts_must_pass_dgp_schema_before_execution
  - llm_does_not_generate_statistical_evidence
  - assumptions_are_logged
  - unsupported_uncertainty_left_blank
  - no_official_staix_data_or_external_real_datasets
deterministic_core_modules:
  - dgpforge.schema
  - dgpforge.contracts
  - dgpforge.simulate
  - dgpforge.truth
  - dgpforge.estimators
  - dgpforge.monte_carlo
  - dgpforge.diagnostics
  - dgpforge.report
  - dgpforge.grid
  - dgpforge.sensitivity
  - dgpforge.calibration
optional_llm_modules:
  - dgpforge.llm.providers
  - dgpforge.llm.schemas
  - dgpforge.llm.prompts
  - dgpforge.llm.contract_drafter
  - dgpforge.llm.paper_extractor
  - dgpforge.llm.config_reviewer
